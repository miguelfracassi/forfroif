<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Paróquia São Pedro · Quem é você?</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Lora:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css"></head><body>
<header class="topo"><h1>Paróquia São Pedro</h1><span class="orn" aria-hidden="true"></span><p>Diocese de Piracicaba</p></header>
<main><section class="cartao">
<h2>Quem é você?</h2><p>Escolha seu usuário para criar um agendamento.</p>
<div class="usuarios">
<button data-u="Marcos"><span class="inicial">M</span>Marcos</button>
<button data-u="Mateus"><span class="inicial">M</span>Mateus</button>
<button data-u="Tânia"><span class="inicial">T</span>Tânia</button>
</div>
<a class="btn sec" href="formulario.html">Imprimir formulário em branco</a></section></main>
<script src="app.js"></script>
<script>
document.querySelectorAll('[data-u]').forEach(b=>b.onclick=()=>{
 try{localStorage.removeItem('agendamento')}catch(e){}
 salvar({usuario:b.dataset.u});
 location.href='dados.html';
});
</script></body></html>
